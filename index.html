<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sand Digger</title>
<meta name="description" content="Sand Digger: dig through the dunes, sling the lizards, drop the pots.">
<meta name="theme-color" content="#1d0f08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235fb8ee'/%3E%3Cpath d='M0 40 Q16 26 32 36 T64 32 V64 H0Z' fill='%23e5ab5c'/%3E%3Ccircle cx='46' cy='18' r='8' fill='%23fff1b8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1d0f08; --fg: #fbe7c6; --accent: #e98a3c; --pad: #3a2214; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: radial-gradient(ellipse at top, #3b2112, var(--bg) 70%);
    color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; height: 100dvh; gap: 8px;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
  }
  canvas { display: block; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  #bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; opacity: .8; }
  #bar button {
    background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer;
  }
  body.touch .hint { display: none; }
  #controls { display: none; width: 100%; max-width: 480px; justify-content: space-between; align-items: center; padding: 0 12px; }
  body.touch #controls { display: flex; }
  #pad {
    position: relative; width: 148px; height: 148px; border-radius: 50%;
    background: radial-gradient(circle, #4a2c19 0%, var(--pad) 70%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.45);
  }
  #pad .arrow { position: absolute; width: 0; height: 0; border: 16px solid transparent; opacity: .55; transition: opacity .08s, transform .08s; }
  #pad .up { left: 58px; top: 10px; border-bottom: 22px solid var(--fg); border-top: 0; }
  #pad .down { left: 58px; bottom: 10px; border-top: 22px solid var(--fg); border-bottom: 0; }
  #pad .left { top: 58px; left: 10px; border-right: 22px solid var(--fg); border-left: 0; }
  #pad .right { top: 58px; right: 10px; border-left: 22px solid var(--fg); border-right: 0; }
  #pad .arrow.active { opacity: 1; transform: scale(1.15); }
  #fire {
    width: 104px; height: 104px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, #ffb46b, var(--accent) 55%, #b4581f);
    color: #3a1d0c; font: 22px "Lilita One", system-ui, sans-serif; letter-spacing: 1px;
    box-shadow: 0 6px 0 #7a3510, 0 10px 22px rgba(0,0,0,.45);
  }
  #fire.active { transform: translateY(4px); box-shadow: 0 2px 0 #7a3510, 0 4px 12px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Sand Digger game"></canvas>
  <div id="bar">
    <span class="hint">Arrows / WASD move · Space slings · P pause · M mute</span>
    <button id="mute" type="button">Sound on</button>
  </div>
  <div id="controls">
    <div id="pad">
      <div class="arrow up"></div><div class="arrow down"></div>
      <div class="arrow left"></div><div class="arrow right"></div>
    </div>
    <button id="fire" type="button">SLING</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const T = 32, COLS = 14, ROWS = 16, HUD = 48;
  const W = COLS * T, H = HUD + ROWS * T;
  const TS = 2;            // terrain canvas resolution multiplier
  const FINE = 8;          // fine grid cell size used to know where sand is carved
  const FC = W / FINE, FR = (ROWS * T) / FINE;
  const TAU = Math.PI * 2;
  const DIRS = { L: { x: -1, y: 0 }, R: { x: 1, y: 0 }, U: { x: 0, y: -1 }, D: { x: 0, y: 1 } };
  const DLIST = [DIRS.L, DIRS.R, DIRS.U, DIRS.D];
  const LAYER_COLORS = ['#f3cd85', '#e5ab5c', '#d08646', '#b4652f'];
  const LAYER_POINTS = [200, 300, 400, 500];
  const CRUSH_POINTS = [0, 1000, 2500, 4000, 6000, 8000, 10000, 12000, 15000];
  const PLAYER_SPEED = 90;
  const START = { c: 6, r: 7 };
  const FONT = '"Lilita One", system-ui, sans-serif';

  const cx = c => c * T + T / 2;
  const cy = r => HUD + r * T + T / 2;
  const colOf = x => Math.floor(x / T);
  const rowOf = y => Math.floor((y - HUD) / T);
  const inB = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
  const layerOf = r => Math.max(0, Math.min(3, Math.floor((r - 1) / 4)));
  const rand = (a, b) => a + Math.random() * (b - a);
  const ri = (a, b) => Math.floor(rand(a, b + 1));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- canvas & sizing ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const view = { scale: 1, dpr: 1 };

  if ('ontouchstart' in window || (window.matchMedia && matchMedia('(pointer: coarse)').matches)) {
    document.body.classList.add('touch');
  }

  function resize() {
    const touch = document.body.classList.contains('touch');
    const reserved = 40 + (touch ? 170 : 0);
    const availW = window.innerWidth - 16, availH = window.innerHeight - 16 - reserved;
    const s = Math.max(0.3, Math.min(availW / W, availH / H));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = Math.round(W * s) + 'px';
    canvas.style.height = Math.round(H * s) + 'px';
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    view.scale = s; view.dpr = dpr;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- sky (static) ----------
  // ---------- procedural texture helpers ----------
  function hash2(x, y, sd) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(sd, 144269504)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, sd) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, sd), b = hash2(xi + 1, yi, sd), c = hash2(xi, yi + 1, sd), d = hash2(xi + 1, yi + 1, sd);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, sd, oct = 4) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < oct; i++) { sum += vnoise(x, y, sd + i * 31) * amp; norm += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return sum / norm;
  }
  const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  // ---------- sky (static) ----------
  const sky = document.createElement('canvas');
  sky.width = W * TS; sky.height = (HUD + T) * TS;
  (function buildSky() {
    const g = sky.getContext('2d');
    g.setTransform(TS, 0, 0, TS, 0, 0);
    const h = HUD + T;
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#2f78bf'); grad.addColorStop(0.45, '#7fb9e2'); grad.addColorStop(0.75, '#d9e3dc'); grad.addColorStop(1, '#f4dcae');
    g.fillStyle = grad; g.fillRect(0, 0, W, h);
    // thin high clouds
    for (let i = 0; i < 5; i++) {
      const x0 = rand(0, W), y0 = rand(6, 26), r0 = rand(20, 45);
      const cg = g.createRadialGradient(x0, y0, 1, x0, y0, r0);
      cg.addColorStop(0, 'rgba(255,255,255,.35)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
      g.save(); g.translate(x0, y0); g.scale(1, 0.18); g.translate(-x0, -y0);
      g.fillStyle = cg; g.beginPath(); g.arc(x0, y0, r0, 0, TAU); g.fill(); g.restore();
    }
    // sun with bloom
    const sx = W - 70, sy = 22;
    const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 70);
    sg.addColorStop(0, 'rgba(255,250,225,.95)'); sg.addColorStop(0.12, 'rgba(255,244,200,.8)');
    sg.addColorStop(0.35, 'rgba(255,225,160,.28)'); sg.addColorStop(1, 'rgba(255,220,150,0)');
    g.fillStyle = sg; g.fillRect(sx - 70, 0, 140, h);
    g.fillStyle = '#fffbea'; g.beginPath(); g.arc(sx, sy, 7, 0, TAU); g.fill();
    // distant mountains in the haze
    g.fillStyle = 'rgba(165,138,120,.45)'; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= W; x += 3) g.lineTo(x, h - 18 - fbm(x * 0.02, 3.7, 11, 3) * 24);
    g.lineTo(W, h); g.closePath(); g.fill();
    const hz = g.createLinearGradient(0, h - 30, 0, h);
    hz.addColorStop(0, 'rgba(245,225,190,0)'); hz.addColorStop(1, 'rgba(245,225,190,.6)');
    g.fillStyle = hz; g.fillRect(0, h - 30, W, 30);
    // dunes lit from the sun on the right: slopes that face it are bright, the lee side is in shade
    const dune = (light, dark, amp, freq, phase, base, sd) => {
      const yAt = x => base - amp * (0.55 + 0.45 * Math.sin(x * freq + phase)) - amp * 0.6 * (fbm(x * freq * 0.8, 1.3, sd, 3) - 0.5);
      const L = hexRgb(light), D = hexRgb(dark);
      for (let x = 0; x < W; x++) {
        const y = yAt(x), slope = yAt(x + 1) - y;
        const t = Math.max(0, Math.min(1, 0.45 + slope * 3));
        g.fillStyle = `rgb(${L.map((c, i) => Math.round(D[i] + (c - D[i]) * t)).join(',')})`;
        g.fillRect(x, y, 1.2, h - y);
      }
    };
    dune('#f8dca8', '#b8895a', 14, 0.013, 1.3, h - 5, 5);
    dune('#f0c890', '#b5834f', 8, 0.024, 0.4, h, 9);
    // date palm: ringed trunk, feathery fronds, a cluster of dates
    const px = 38, base = h - 3;
    for (let i = 0; i <= 18; i++) {
      const t = i / 18, x = px + Math.sin(t * 1.6) * 5, y = base - t * 36;
      g.fillStyle = i % 2 ? '#5e3a20' : '#7c502c';
      g.beginPath(); g.ellipse(x, y, 3.4 - t * 1.2, 1.5, 0, 0, TAU); g.fill();
    }
    const tx = px + Math.sin(1.6) * 5, ty = base - 36;
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + (i - 4) * 0.42 + rand(-0.08, 0.08), len = rand(16, 23);
      const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.6 + len * 0.45;
      const mx = tx + Math.cos(a) * len * 0.5, my = ty + Math.sin(a) * len * 0.5 - 4;
      g.strokeStyle = i % 2 ? '#2f6b2a' : '#44863a'; g.lineWidth = 0.9;
      for (let k = 1; k <= 12; k++) {
        const t = k / 12;
        const qx = (1 - t) * (1 - t) * tx + 2 * (1 - t) * t * mx + t * t * ex;
        const qy = (1 - t) * (1 - t) * ty + 2 * (1 - t) * t * my + t * t * ey;
        const ll = 5 * (1 - t * 0.6);
        g.beginPath();
        g.moveTo(qx, qy); g.lineTo(qx + Math.cos(a + 1.9) * ll, qy + Math.sin(a + 1.9) * ll + 2);
        g.moveTo(qx, qy); g.lineTo(qx + Math.cos(a - 1.9) * ll, qy + Math.sin(a - 1.9) * ll + 2);
        g.stroke();
      }
      g.strokeStyle = '#2a5424'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
    }
    for (let i = 0; i < 6; i++) {
      g.fillStyle = i % 2 ? '#7a3a14' : '#9a5220';
      g.beginPath(); g.arc(tx - 3 + i * 1.3, ty + 3 + (i % 2) * 1.2, 1.3, 0, TAU); g.fill();
    }
  })();

  // ---------- terrain (carvable) ----------
  const terr = document.createElement('canvas');
  terr.width = W * TS; terr.height = ROWS * T * TS;
  const tctx = terr.getContext('2d');
  // A solid copy of the sand, carved in step with it, drawn offset and dark to shade the inside of tunnels.
  const shade = document.createElement('canvas');
  shade.width = terr.width; shade.height = terr.height;
  const shctx = shade.getContext('2d');
  const tunnelBg = document.createElement('canvas');
  tunnelBg.width = terr.width; tunnelBg.height = terr.height;
  const ground = document.createElement('canvas');
  ground.width = terr.width; ground.height = terr.height;
  const gctx = ground.getContext('2d');
  let dirty = null;   // [x0, y0, x1, y1] in ground pixels still to recomposite
  function markDirty(x0, y0, x1, y1) {
    x0 = Math.max(0, Math.floor(x0 * TS)); y0 = Math.max(0, Math.floor(y0 * TS));
    x1 = Math.min(ground.width, Math.ceil(x1 * TS)); y1 = Math.min(ground.height, Math.ceil(y1 * TS));
    dirty = dirty ? [Math.min(dirty[0], x0), Math.min(dirty[1], y0), Math.max(dirty[2], x1), Math.max(dirty[3], y1)] : [x0, y0, x1, y1];
  }
  // The sand casts a soft shadow into the tunnels, mostly from above: [dx, dy, alpha] in logical pixels.
  const SHADOW_PASSES = [[0, 4, 0.35], [0, 2, 0.3], [-2, 1, 0.14], [2, 1, 0.14]];
  function composeGround() {
    if (!dirty) return;
    const [x0, y0, x1, y1] = dirty, w = x1 - x0, h = y1 - y0;
    dirty = null;
    if (w <= 0 || h <= 0) return;
    const g = gctx;
    g.clearRect(x0, y0, w, h);
    g.drawImage(tunnelBg, x0, y0, w, h, x0, y0, w, h);
    for (const [dx, dy, a] of SHADOW_PASSES) {
      const sx = x0 - dx * TS, sy = y0 - dy * TS;
      const cx0 = Math.max(0, sx), cy0 = Math.max(0, sy);
      const cw = Math.min(shade.width, sx + w) - cx0, ch = Math.min(shade.height, sy + h) - cy0;
      if (cw <= 0 || ch <= 0) continue;
      g.globalAlpha = a;
      g.drawImage(shade, cx0, cy0, cw, ch, cx0 + dx * TS, cy0 + dy * TS, cw, ch);
    }
    g.globalAlpha = 1;
    g.drawImage(terr, x0, y0, w, h, x0, y0, w, h);
  }
  let fine = new Uint8Array(FC * FR);
  const LAYER_RGB = LAYER_COLORS.map(hexRgb);

  // Sand texture: layers with wavy boundaries, mottling, fine strata and grain, darker with depth.
  function sandImage(sd, floor) {
    const w = terr.width, h = terr.height, img = new ImageData(w, h), d = img.data;
    for (let ly = T; ly < ROWS * T; ly++) {
      const depth = (ly - T) / ((ROWS - 1) * T);
      for (let lx = 0; lx < W; lx++) {
        const big = fbm(lx * 0.025, ly * 0.025, sd, 3);
        const lf = Math.max(0, Math.min(3.999, depth * 4 + (big - 0.5) * 0.5));
        const L = lf | 0, fr = lf - L;
        let c = LAYER_RGB[L];
        let sh = (fbm(lx * 0.12, ly * 0.12, sd + 7, 2) - 0.5) * 0.16;
        sh += Math.sin((ly + big * 30) * 0.9) * 0.025;
        sh -= depth * 0.1;
        if (L > 0 && fr < 0.05) {
          const t = fr / 0.05, pc = LAYER_RGB[L - 1];
          c = [pc[0] + (c[0] - pc[0]) * t, pc[1] + (c[1] - pc[1]) * t, pc[2] + (c[2] - pc[2]) * t];
          sh -= 0.1 * (1 - Math.abs(2 * t - 1));
        }
        if (floor) sh = sh * 0.6 - 0.58 - depth * 0.12;
        for (let sy = 0; sy < TS; sy++) for (let sx = 0; sx < TS; sx++) {
          const px = lx * TS + sx, py = ly * TS + sy, k = 1 + sh + (hash2(px, py, sd) - 0.5) * 0.14;
          const i = (py * w + px) * 4;
          d[i] = c[0] * k; d[i + 1] = c[1] * k; d[i + 2] = c[2] * k; d[i + 3] = 255;
        }
      }
    }
    return img;
  }

  // Pebbles, dry roots near the surface and a few fossil shells deep down.
  function decorateSand(g) {
    g.setTransform(TS, 0, 0, TS, 0, 0);
    const tones = [['#c9b597', '#6a5a46'], ['#9e8a72', '#4e4032'], ['#b39a7c', '#5c4834']];
    for (let i = 0; i < 90; i++) {
      const x = rand(0, W), y = rand(T + 4, ROWS * T - 2), r = rand(1, 3) * (1 + (y / (ROWS * T)) * 0.6);
      const [lt, dk] = tones[i % 3], ry = r * rand(0.6, 0.9), rot = rand(0, Math.PI);
      g.fillStyle = 'rgba(40,20,10,.25)';
      g.beginPath(); g.ellipse(x + 0.6, y + 0.8, r * 1.05, ry * 1.05, rot, 0, TAU); g.fill();
      const pg = g.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.15, x, y, r);
      pg.addColorStop(0, lt); pg.addColorStop(1, dk);
      g.fillStyle = pg; g.beginPath(); g.ellipse(x, y, r, ry, rot, 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(95,58,28,.45)'; g.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      let x = rand(0, W), y = T, a = Math.PI / 2 + rand(-0.4, 0.4);
      g.lineWidth = rand(0.6, 1.2); g.beginPath(); g.moveTo(x, y);
      const n = ri(6, 12);
      for (let k = 0; k < n; k++) {
        a += rand(-0.5, 0.5); x += Math.cos(a) * 5; y += Math.abs(Math.sin(a)) * 5; g.lineTo(x, y);
        if (Math.random() < 0.3) { g.moveTo(x, y); g.lineTo(x + rand(-6, 6), y + rand(2, 6)); g.moveTo(x, y); }
      }
      g.stroke();
    }
    for (let i = 0; i < 4; i++) {
      const x = rand(20, W - 20), y = rand(T * 10, T * 15), r = rand(3, 5);
      g.strokeStyle = 'rgba(245,230,205,.45)'; g.lineWidth = 0.8; g.beginPath();
      for (let t = 0; t < 14; t += 0.2) { const rr = r * t / 14; g.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
      g.stroke();
      g.lineWidth = 0.5;
      for (let t = 0; t < TAU; t += 0.5) { g.beginPath(); g.moveTo(x + Math.cos(t) * r * 0.55, y + Math.sin(t) * r * 0.55); g.lineTo(x + Math.cos(t) * r, y + Math.sin(t) * r); g.stroke(); }
    }
    const cg = g.createLinearGradient(0, T, 0, T + 6);
    cg.addColorStop(0, 'rgba(255,248,225,.55)'); cg.addColorStop(1, 'rgba(255,248,225,0)');
    g.fillStyle = cg; g.fillRect(0, T, W, 6);
  }

  tunnelBg.getContext('2d').putImageData(sandImage(ri(1, 9999), true), 0, 0);

  function buildTerrain() {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
    tctx.putImageData(sandImage(ri(1, 9999), false), 0, 0);
    decorateSand(tctx);
    shctx.setTransform(TS, 0, 0, TS, 0, 0);
    shctx.globalCompositeOperation = 'source-over';
    shctx.clearRect(0, 0, W, ROWS * T);
    shctx.fillStyle = '#000'; shctx.fillRect(0, T, W, (ROWS - 1) * T);

    fine = new Uint8Array(FC * FR);
    for (let r = 0; r < T / FINE; r++) for (let c = 0; c < FC; c++) fine[r * FC + c] = 1;
    markDirty(0, 0, W, ROWS * T);
  }

  // Removes sand in a circle; returns how many fine cells were newly opened.
  function carve(x, y, rad = 14) {
    const ly = y - HUD;
    // a few small bites around the rim make the tunnel edge crumbly instead of a perfect circle
    const bites = [[x, ly, rad]];
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU), r2 = rand(2.5, 4.5);
      bites.push([x + Math.cos(a) * (rad - r2 * 0.6), ly + Math.sin(a) * (rad - r2 * 0.6), r2]);
    }
    for (const g of [tctx, shctx]) {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = '#000';
      g.beginPath();
      for (const [bx, by, br] of bites) { g.moveTo(bx + br, by); g.arc(bx, by, br, 0, TAU); }
      g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    markDirty(x - rad - 8, ly - rad - 8, x + rad + 8, ly + rad + 8);
    let n = 0;
    const c0 = Math.max(0, Math.floor((x - rad) / FINE)), c1 = Math.min(FC - 1, Math.floor((x + rad) / FINE));
    const r0 = Math.max(0, Math.floor((ly - rad) / FINE)), r1 = Math.min(FR - 1, Math.floor((ly + rad) / FINE));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const px = c * FINE + FINE / 2, py = r * FINE + FINE / 2;
      if ((px - x) ** 2 + (py - ly) ** 2 <= rad * rad && !fine[r * FC + c]) { fine[r * FC + c] = 1; n++; }
    }
    return n;
  }
  function openAt(x, y) {
    const c = Math.floor(x / FINE), r = Math.floor((y - HUD) / FINE);
    if (c < 0 || c >= FC || r < 0 || r >= FR) return false;
    return !!fine[r * FC + c];
  }

  // ---------- audio ----------
  const audio = {
    ctx: null, master: null, noiseBuf: null, muted: store.get('sd_muted', false),
    unlock() {
      if (!this.ctx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = this.muted ? 0 : 0.5;
          this.master.connect(this.ctx.destination);
          const len = this.ctx.sampleRate;
          this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const d = this.noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        } catch (e) { this.ctx = null; }
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    setMuted(m) {
      this.muted = m; store.set('sd_muted', m);
      if (this.master) this.master.gain.value = m ? 0 : 0.5;
      muteBtn.textContent = m ? 'Sound off' : 'Sound on';
    }
  };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(freq, dur, type = 'square', vol = 0.2, when = 0, slideTo = null) {
    const a = audio.ctx; if (!a || audio.muted) return;
    const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, when = 0) {
    const a = audio.ctx; if (!a || audio.muted) return;
    const t = a.currentTime + when;
    const s = a.createBufferSource(); s.buffer = audio.noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(audio.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  const sfx = {
    sling() { tone(900, 0.12, 'triangle', 0.18, 0, 300); noise(0.05, 0.08, 3000); },
    hit(n) { tone(300 + n * 120, 0.1, 'square', 0.12, 0, 150 + n * 80); },
    ko() { noise(0.25, 0.3, 1200); tone(600, 0.2, 'square', 0.14, 0, 1500); },
    dig() { noise(0.05, 0.05, 2200); },
    wobble() { tone(180, 0.08, 'triangle', 0.14); tone(160, 0.08, 'triangle', 0.14, 0.1); tone(180, 0.08, 'triangle', 0.14, 0.2); },
    shatter() { noise(0.4, 0.4, 1800); tone(220, 0.2, 'square', 0.1, 0, 80); },
    die() { [74, 70, 69, 66, 63, 62].forEach((m, i) => tone(mtof(m), 0.18, 'square', 0.12, i * 0.13)); },
    bonus() { [62, 66, 69, 74].forEach((m, i) => tone(mtof(m + 12), 0.12, 'square', 0.1, i * 0.07)); },
    clear() { [62, 63, 66, 67, 69, 70, 72, 74].forEach((m, i) => tone(mtof(m + 12), 0.14, 'square', 0.1, i * 0.08)); },
    escape() { tone(700, 0.35, 'square', 0.08, 0, 120); },
    hiss() { noise(0.35, 0.12, 6000); },
    spit() { tone(500, 0.12, 'sawtooth', 0.08, 0, 180); noise(0.1, 0.1, 2500); },
    start() { [62, 66, 69].forEach((m, i) => tone(mtof(m + 12), 0.16, 'square', 0.1, i * 0.1)); }
  };

  // Walking tune in a Hijaz scale on D: it only advances while the hero is moving.
  const MEL = [62, 63, 66, 67, 69, 67, 66, 63, 62, 66, 69, 70, 69, 67, 66, null,
               69, 70, 72, 74, 72, 70, 69, 67, 66, 67, 66, 63, 62, null, 62, null];
  const BASS = [50, null, null, null, 45, null, null, null];
  let musicStep = 0, musicT = 0;
  function updateMusic(dt) {
    if (state !== 'play' || !player.moving) return;
    musicT -= dt;
    if (musicT <= 0) {
      musicT = Math.max(musicT + 0.15, 0);
      const m = MEL[musicStep % MEL.length];
      if (m) tone(mtof(m + 12), 0.13, 'square', 0.05);
      const b = BASS[musicStep % BASS.length];
      if (b) tone(mtof(b), 0.28, 'triangle', 0.12);
      musicStep++;
    }
  }

  // ---------- game state ----------
  let dug, linkH, linkV, pots, enemies, pebble, venoms = [], particles = [], floats = [], dallah, potsDropped;
  let state = 'title', stateT = 0, score = 0, best = store.get('sd_best', 0), lives = 3, level = 1;
  let shake = 0, time = 0, paused = false, digSfxT = 0, escaped = false;
  const player = {};

  const grid = v => Array.from({ length: ROWS }, () => new Array(COLS).fill(v));

  function buildLevel() {
    dug = grid(false); linkH = grid(false); linkV = grid(false);
    buildTerrain();
    for (let c = 0; c < COLS; c++) { dug[0][c] = true; if (c < COLS - 1) linkH[0][c] = true; }
    for (let r = 0; r <= START.r; r++) { dug[r][START.c] = true; if (r < START.r) linkV[r][START.c] = true; }

    const occ = grid(false);
    for (let r = 0; r <= START.r + 1; r++) occ[r][START.c] = true;
    const free3 = (c, r) => {
      for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if (inB(x, y) && occ[y][x]) return false;
      return true;
    };

    enemies = [];
    const want = Math.min(3 + level, 8);
    let tries = 0;
    while (enemies.length < want && tries++ < 600) {
      const horiz = Math.random() < 0.6, len = ri(3, 4);
      const c0 = ri(0, COLS - (horiz ? len : 1));
      const r0 = ri(2, ROWS - (horiz ? 1 : len));
      const cells = [];
      for (let i = 0; i < len; i++) cells.push(horiz ? [c0 + i, r0] : [c0, r0 + i]);
      if (!cells.every(([c, r]) => inB(c, r) && free3(c, r) && Math.abs(c - START.c) + Math.abs(r - START.r) >= 4)) continue;
      cells.forEach(([c, r], i) => {
        occ[r][c] = true; dug[r][c] = true;
        if (i > 0) { if (horiz) linkH[r][c - 1] = true; else linkV[r - 1][c] = true; }
      });
      const [mc, mr] = cells[Math.floor(len / 2)];
      enemies.push(makeEnemy(mc, mr, enemies.length % 3 === 1 ? 'cobra' : 'lizard'));
    }

    pots = []; tries = 0;
    while (pots.length < 3 && tries++ < 400) {
      const c = ri(0, COLS - 1), r = ri(2, 11);
      if (!free3(c, r) || !free3(c, r + 1) || pots.some(p => p.c === c)) continue;
      occ[r][c] = true;
      pots.push({ c, r, y: cy(r), state: 'rest', t: 0, crushed: [] });
    }

    for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (dug[r][c]) carve(cx(c), cy(r));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (linkH[r][c] && r >= 1) for (let s = 0; s <= T; s += 4) carve(cx(c) + s, cy(r));
      if (linkV[r][c]) for (let s = 0; s <= T; s += 4) carve(cx(c), cy(r) + s);
    }

    potsDropped = 0; escaped = false; dallah = null; particles = []; floats = []; pebble = null; venoms = [];
    resetPlayer();
  }

  function makeEnemy(c, r, kind) {
    return { kind, spitCool: rand(2, 4), windT: 0, flee: false, fleeT: 0, sc: c, sr: r, x: cx(c), y: cy(r), tx: cx(c), ty: cy(r), dir: DIRS.R, face: 1, state: 'walk',
             prev: 'walk', hits: 0, stunT: 0, flash: 0, ghostT: 0, wanderT: rand(6, 11), popT: 0,
             anim: Math.random() * 10, squash: 0 };
  }
  function resetEnemy(e) {
    Object.assign(e, { x: cx(e.sc), y: cy(e.sr), tx: cx(e.sc), ty: cy(e.sr), state: 'walk', hits: 0, stunT: 0, wanderT: rand(6, 11), spitCool: rand(2, 4), flee: false, fleeT: 0 });
  }
  function resetPlayer() {
    Object.assign(player, { x: cx(START.c), y: cy(START.r), dir: null, face: DIRS.R, hface: 1,
      lastC: START.c, lastR: START.r, moving: false, anim: 0, shootT: 0, cool: 0, alive: true, crushed: false });
  }

  function setState(s) { state = s; stateT = 0; }
  function startGame() {
    score = 0; lives = 3; level = 1; musicStep = 0;
    buildLevel(); setState('ready'); sfx.start();
  }
  function addScore(n) { score += n; if (score > best) best = score; }
  function saveBest() { store.set('sd_best', best); }

  // ---------- input ----------
  const input = {
    held: [], fireQ: false,
    dir() { return this.held.length ? this.held[this.held.length - 1] : null; },
    press(d) { this.release(d); this.held.push(d); },
    release(d) { const i = this.held.indexOf(d); if (i >= 0) this.held.splice(i, 1); }
  };
  const KEYS = { ArrowLeft: DIRS.L, ArrowRight: DIRS.R, ArrowUp: DIRS.U, ArrowDown: DIRS.D,
                 a: DIRS.L, d: DIRS.R, w: DIRS.U, s: DIRS.D, A: DIRS.L, D: DIRS.R, W: DIRS.U, S: DIRS.D };
  function onFire() {
    audio.unlock();
    if (state === 'title' || (state === 'over' && stateT > 0.8)) startGame();
    else input.fireQ = true;
  }
  function togglePause() {
    if (state === 'play' || paused) { paused = !paused; input.held = []; }
  }
  window.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); if (!e.repeat) input.press(KEYS[e.key]); audio.unlock(); return; }
    if (e.key === ' ' || e.key === 'z' || e.key === 'x' || e.key === 'Z' || e.key === 'X' || e.key === 'Enter') {
      e.preventDefault(); if (!e.repeat) onFire(); return;
    }
    if (e.key === 'm' || e.key === 'M') audio.setMuted(!audio.muted);
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => { if (KEYS[e.key]) input.release(KEYS[e.key]); });
  window.addEventListener('blur', () => { input.held = []; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
  window.addEventListener('pagehide', saveBest);

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); audio.unlock();
    if (paused) togglePause();
    else if (state === 'title' || state === 'over') onFire();
  });

  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', () => { audio.unlock(); audio.setMuted(!audio.muted); muteBtn.blur(); });
  audio.setMuted(audio.muted);

  const pad = document.getElementById('pad');
  const arrows = { U: pad.querySelector('.up'), D: pad.querySelector('.down'), L: pad.querySelector('.left'), R: pad.querySelector('.right') };
  let padId = null, padDir = null;
  function padSet(d) {
    if (padDir === d) return;
    if (padDir) input.release(padDir);
    padDir = d;
    if (d) input.press(d);
    for (const k in arrows) arrows[k].classList.toggle('active', DIRS[k] === d);
  }
  function padMove(e) {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < 10) return;
    padSet(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? DIRS.L : DIRS.R) : (dy < 0 ? DIRS.U : DIRS.D));
  }
  pad.addEventListener('pointerdown', e => { e.preventDefault(); audio.unlock(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
  const padEnd = e => { if (e.pointerId === padId) { padId = null; padSet(null); } };
  pad.addEventListener('pointerup', padEnd);
  pad.addEventListener('pointercancel', padEnd);
  pad.addEventListener('lostpointercapture', padEnd);

  const fireBtn = document.getElementById('fire');
  fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireBtn.classList.add('active'); if (paused) togglePause(); else onFire(); });
  const fireUp = () => fireBtn.classList.remove('active');
  fireBtn.addEventListener('pointerup', fireUp);
  fireBtn.addEventListener('pointercancel', fireUp);
  fireBtn.addEventListener('pointerleave', fireUp);

  // ---------- effects ----------
  function burst(x, y, color, n, speed, grav = 120) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(0.3, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.6), max: 0.6, color, size: rand(1.5, 3.2), g: grav });
    }
  }
  function puff(x, y, color = 'rgba(240,215,170,1)') {
    particles.push({ x, y, vx: rand(-10, 10), vy: rand(-18, -6), life: 0.5, max: 0.5, color, size: rand(3, 5), g: 0, puff: true });
  }
  function floatText(x, y, text) { floats.push({ x, y, text: String(text), life: 1.1 }); }

  function updateParticles(dt) {
    for (const p of particles) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.puff) p.size += 10 * dt; }
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 700) particles.splice(0, particles.length - 700);
    for (const f of floats) { f.life -= dt; f.y -= 28 * dt; }
    floats = floats.filter(f => f.life > 0);
  }

  // ---------- player ----------
  function canEnter(c, r) {
    return inB(c, r) && !pots.some(p => p.state !== 'fall' && p.c === c && p.r === r);
  }

  function updatePlayer(dt) {
    player.cool = Math.max(0, player.cool - dt);
    player.shootT = Math.max(0, player.shootT - dt);
    const want = input.dir();
    player.moving = false;
    if (want) {
      if (!player.dir) player.dir = want;
      if (want.x === -player.dir.x && want.y === -player.dir.y) player.dir = want;
      let rem = PLAYER_SPEED * dt, guard = 0;
      while (rem > 1e-4 && guard++ < 6) {
        const c = colOf(player.x), r = rowOf(player.y);
        const ccx = cx(c), ccy = cy(r);
        const centered = Math.abs(player.x - ccx) < 0.01 && Math.abs(player.y - ccy) < 0.01;
        let tx, ty;
        if (centered) {
          player.x = ccx; player.y = ccy;
          // At a junction the hero always turns toward the held direction, or stops at a wall.
          if (!canEnter(c + want.x, r + want.y)) break;
          player.dir = want;
          tx = cx(c + want.x); ty = cy(r + want.y);
        } else if (player.dir.x) {
          tx = (player.dir.x > 0) === (ccx > player.x) ? ccx : cx(c + player.dir.x); ty = player.y;
        } else {
          ty = (player.dir.y > 0) === (ccy > player.y) ? ccy : cy(r + player.dir.y); tx = player.x;
        }
        const dx = tx - player.x, dy = ty - player.y, d = Math.abs(dx) + Math.abs(dy);
        if (d < 1e-6) break;
        const s = Math.min(rem, d);
        player.x += Math.sign(dx) * (dx ? s : 0);
        player.y += Math.sign(dy) * (dy ? s : 0);
        rem -= s; player.moving = true;
        if (s === d) { player.x = tx; player.y = ty; arrive(colOf(tx), rowOf(ty)); }
      }
      player.face = player.dir;
      if (player.dir.x) player.hface = player.dir.x;
    }
    if (player.moving) { player.anim += dt; dig(dt); }
    if (input.fireQ) { input.fireQ = false; shoot(); }
  }

  function arrive(c, r) {
    const pc = player.lastC, pr = player.lastR;
    if (Math.abs(pc - c) + Math.abs(pr - r) === 1) {
      if (pr === r) linkH[r][Math.min(pc, c)] = true; else linkV[Math.min(pr, r)][c] = true;
    }
    player.lastC = c; player.lastR = r;
  }

  function dig(dt) {
    const c = colOf(player.x), r = rowOf(player.y);
    if (r >= 1 && !dug[r][c]) { dug[r][c] = true; addScore(10); }
    const f = player.face;
    const n = carve(player.x + f.x * 2, player.y + f.y * 2);
    digSfxT -= dt;
    if (n > 0) {
      const color = LAYER_COLORS[layerOf(Math.max(1, rowOf(player.y + f.y * 12)))];
      for (let i = 0; i < Math.min(6, n + 1); i++) {
        particles.push({
          x: player.x + f.x * 12 + rand(-6, 6), y: player.y + f.y * 12 + rand(-6, 6),
          vx: -f.x * rand(30, 90) + rand(-40, 40), vy: -f.y * rand(30, 90) + rand(-80, -20),
          life: rand(0.35, 0.7), max: 0.7, color, size: rand(1.5, 3), g: 300
        });
      }
      if (digSfxT <= 0) { sfx.dig(); digSfxT = 0.12; }
    } else if (Math.random() < 0.08) {
      puff(player.x - f.x * 8, player.y + 10);
    }
  }

  function shoot() {
    if (player.cool > 0 || pebble) return;
    const f = player.face;
    pebble = { x: player.x + f.x * 8, y: player.y + f.y * 8, dir: f, dist: 0 };
    player.cool = 0.28; player.shootT = 0.18;
    sfx.sling();
  }

  function updatePebble(dt) {
    if (!pebble) return;
    let s = 420 * dt;
    while (s > 0 && pebble) {
      const st = Math.min(4, s); s -= st;
      pebble.x += pebble.dir.x * st; pebble.y += pebble.dir.y * st; pebble.dist += st;
      if (pebble.dist > T * 3.5) { pebble = null; return; }
      if (!openAt(pebble.x, pebble.y)) {
        for (let i = 0; i < 4; i++) puff(pebble.x, pebble.y, LAYER_COLORS[layerOf(Math.max(1, rowOf(pebble.y)))]);
        pebble = null; return;
      }
      for (const e of enemies) {
        if ((e.state === 'walk' || e.state === 'ghost' || e.state === 'stunned' || e.state === 'windup') && Math.hypot(e.x - pebble.x, e.y - pebble.y) < 15) {
          hitEnemy(e, pebble.dir); pebble = null; return;
        }
      }
    }
  }

  function hitEnemy(e, dir) {
    if (e.state !== 'stunned') e.prev = e.state === 'ghost' ? 'ghost' : 'walk';
    e.hits++; e.flash = 0.12; e.squash = 1;
    shake = Math.max(shake, 2.5);
    burst(e.x, e.y, '#fff6d0', 8, 120);
    if (e.hits >= 3) {
      e.state = 'pop'; e.popT = 0;
      const pts = LAYER_POINTS[layerOf(Math.max(1, rowOf(e.y)))] * (e.kind === 'cobra' && dir && dir.x ? 2 : 1);
      addScore(pts); floatText(e.x, e.y - 14, pts);
      shake = Math.max(shake, 5);
      burst(e.x, e.y, '#ffd84a', 16, 200); burst(e.x, e.y, '#9bb84a', 10, 160);
      sfx.ko();
    } else {
      e.state = 'stunned'; e.stunT = 1.7;
      sfx.hit(e.hits);
    }
  }

  function killPlayer(crushed) {
    if (!player.alive) return;
    player.alive = false; player.crushed = !!crushed;
    pebble = null; venoms = []; shake = 8;
    burst(player.x, player.y, '#ffffff', 12, 150);
    sfx.die();
    setState('dying');
  }

  function afterDeath() {
    lives--;
    if (lives <= 0) { setState('over'); saveBest(); return; }
    resetPlayer();
    for (const e of enemies) if (e.state !== 'dead' && e.state !== 'crushed') resetEnemy(e);
    input.held = []; padSet(null);
    setState('ready');
  }

  // ---------- enemies ----------
  function linkOpen(c, r, d) {
    if (!inB(c + d.x, r + d.y)) return false;
    if (d.x === 1) return linkH[r][c];
    if (d.x === -1) return linkH[r][c - 1];
    if (d.y === 1) return linkV[r][c];
    return linkV[r - 1][c];
  }

  function decide(e) {
    const c = colOf(e.x), r = rowOf(e.y);
    const opts = DLIST.filter(d => r + d.y >= 1 && linkOpen(c, r, d));
    let ch = opts.filter(d => !(d.x === -e.dir.x && d.y === -e.dir.y));
    if (!ch.length) ch = opts;
    if (!ch.length) return;
    const pc = colOf(player.x), pr = rowOf(player.y);
    const dist = d => Math.abs(c + d.x - pc) + Math.abs(r + d.y - pr);
    const d = Math.random() < 0.65 ? ch.reduce((b, o) => (dist(o) < dist(b) ? o : b)) : ch[ri(0, ch.length - 1)];
    e.dir = d; e.tx = cx(c + d.x); e.ty = cy(r + d.y);
  }

  function walkEnemy(e, dt, sp, lonely) {
    e.wanderT -= dt * (lonely ? 2 : 1);
    let rem = sp * dt, guard = 0;
    while (rem > 0 && guard++ < 4) {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
      if (d <= rem) {
        e.x = e.tx; e.y = e.ty; rem -= d;
        if (e.flee) {
          decideFlee(e);
          if (e.state !== 'walk') return;
          continue;
        }
        if (e.wanderT <= 0) { e.state = 'ghost'; e.ghostT = 0; return; }
        decide(e);
        if (e.tx === e.x && e.ty === e.y) { e.wanderT -= dt * 2; return; }
      } else { e.x += dx / d * rem; e.y += dy / d * rem; rem = 0; }
    }
    if (e.dir.x) e.face = e.dir.x;
  }

  // The last enemy runs for the exit at the top-left corner of the surface.
  const EXIT = { c: 0, r: 0 };
  function exitStep(c, r) {
    const dist = grid(-1);
    dist[EXIT.r][EXIT.c] = 0;
    const q = [[EXIT.c, EXIT.r]];
    while (q.length) {
      const [qc, qr] = q.shift();
      for (const d of DLIST) {
        const nc = qc + d.x, nr = qr + d.y;
        if (linkOpen(qc, qr, d) && dist[nr][nc] < 0) { dist[nr][nc] = dist[qr][qc] + 1; q.push([nc, nr]); }
      }
    }
    if (dist[r][c] < 0) return null;
    return DLIST.find(d => linkOpen(c, r, d) && dist[r + d.y][c + d.x] === dist[r][c] - 1) || null;
  }

  function decideFlee(e) {
    if (e.x < 0) { escapeEnemy(e); return; }
    const c = colOf(e.x), r = rowOf(e.y);
    if (c === EXIT.c && r === EXIT.r) { e.dir = DIRS.L; e.tx = -24; e.ty = cy(0); return; }
    const d = exitStep(c, r);
    if (!d) { e.state = 'ghost'; e.ghostT = 0; return; }   // no tunnel out: burrow straight up
    e.dir = d; e.tx = cx(c + d.x); e.ty = cy(r + d.y);
  }

  function escapeEnemy(e) {
    e.state = 'dead'; escaped = true;
    floatText(60, cy(0) + 4, 'ESCAPED!');
    sfx.escape();
  }

  function ghostEnemy(e, dt, gs) {
    e.ghostT += dt;
    if (e.flee) {
      e.y -= gs * 1.4 * dt;
      if (Math.random() < 0.2) puff(e.x + rand(-8, 8), e.y + rand(-8, 8), LAYER_COLORS[layerOf(Math.max(1, rowOf(e.y)))]);
      if (e.y <= cy(0)) {
        e.x = cx(colOf(e.x)); e.y = cy(0); e.tx = e.x; e.ty = e.y;
        e.state = 'walk'; decideFlee(e);
      }
      return;
    }
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * gs * dt; e.y += dy / d * gs * dt;
    e.y = Math.max(cy(1), e.y);
    if (Math.abs(dx) > 1) e.face = Math.sign(dx);
    if (Math.random() < 0.15) puff(e.x + rand(-8, 8), e.y + rand(-8, 8), LAYER_COLORS[layerOf(Math.max(1, rowOf(e.y)))]);
    if (e.ghostT > 1.5) {
      const c = colOf(e.x), r = rowOf(e.y);
      if (inB(c, r) && r >= 1 && dug[r][c] && Math.hypot(e.x - cx(c), e.y - cy(r)) < 5) {
        e.x = cx(c); e.y = cy(r); e.tx = e.x; e.ty = e.y;
        e.state = 'walk'; e.wanderT = rand(6, 10) / (1 + level * 0.1); e.dir = DIRS.R;
        decide(e);
      }
    }
  }

  function updateEnemies(dt) {
    const active = enemies.filter(e => e.state === 'walk' || e.state === 'ghost' || e.state === 'stunned' || e.state === 'windup').length;
    const lonely = active === 1;
    const sp = 46 + level * 4 + (lonely ? 16 : 0), gs = 30 + level * 3;
    for (const e of enemies) {
      e.anim += dt; e.flash = Math.max(0, e.flash - dt); e.squash = Math.max(0, e.squash - dt * 4);
      if (lonely && !e.flee && (e.state === 'walk' || e.state === 'ghost' || e.state === 'windup')) {
        e.fleeT += dt;
        if (e.fleeT > 1) { e.flee = true; if (e.state === 'windup') e.state = 'walk'; }
      }
      if (e.state === 'walk') {
        walkEnemy(e, dt, sp, lonely);
        if (e.kind === 'cobra' && e.state === 'walk' && !e.flee) maybeSpit(e, dt);
      }
      else if (e.state === 'windup') {
        e.windT += dt;
        if (e.windT > 0.6) {
          venoms.push({ x: e.x + e.face * 14, y: e.y - 6, dir: e.face, dist: 0 });
          e.state = 'walk'; e.spitCool = rand(2.5, 4.5) / (1 + level * 0.08);
          sfx.spit();
        }
      }
      else if (e.state === 'ghost') ghostEnemy(e, dt, gs);
      else if (e.state === 'stunned') { e.stunT -= dt; if (e.stunT <= 0) { e.hits = 0; e.state = e.prev; } }
      else if (e.state === 'pop') { e.popT += dt; if (e.popT > 0.45) e.state = 'dead'; }
      if ((e.state === 'walk' || e.state === 'ghost' || e.state === 'windup') && player.alive && Math.hypot(e.x - player.x, e.y - player.y) < 20) killPlayer(false);
    }
  }

  // Cobras rear up and spit venom sideways. The venom flies through sand, like the arcade dragon's fire.
  function maybeSpit(e, dt) {
    e.spitCool -= dt;
    if (e.spitCool > 0) return;
    const dx = player.x - e.x;
    const inLine = player.alive && Math.abs(player.y - e.y) < 12 && dx * e.face > 0 && Math.abs(dx) < T * 4.5;
    if (inLine || Math.random() < dt * 0.3) { e.state = 'windup'; e.windT = 0; sfx.hiss(); }
  }

  function updateVenoms(dt) {
    for (const v of venoms) {
      const st = 210 * dt;
      v.x += v.dir * st; v.dist += st;
      if (Math.random() < 0.6) particles.push({ x: v.x - v.dir * 4, y: v.y + rand(-2, 2), vx: -v.dir * rand(10, 30), vy: rand(-10, 10),
                                                life: 0.3, max: 0.3, color: '#9be04a', size: rand(1.5, 2.5), g: 0 });
      if (player.alive && Math.hypot(v.x - player.x, v.y - player.y) < 12) { v.dist = 1e9; killPlayer(false); }
    }
    venoms = venoms.filter(v => v.dist < T * 4 && v.x > -10 && v.x < W + 10);
  }

  // ---------- pots & bonus ----------
  function updatePots(dt) {
    for (const p of pots) {
      if (p.state === 'rest') {
        if (p.r + 1 < ROWS && dug[p.r + 1][p.c]) { p.state = 'wobble'; p.t = 0; sfx.wobble(); }
      } else if (p.state === 'wobble') {
        p.t += dt;
        if (p.t > 0.8) { p.state = 'fall'; dug[p.r][p.c] = true; carve(cx(p.c), cy(p.r), 13); }
      } else if (p.state === 'fall') {
        p.y += 260 * dt;
        const px = cx(p.c);
        for (const e of enemies) {
          if ((e.state === 'walk' || e.state === 'ghost' || e.state === 'stunned' || e.state === 'windup') &&
              Math.abs(e.x - px) < 20 && e.y > p.y - 6 && e.y < p.y + 26) {
            e.state = 'crushed'; p.crushed.push(e); sfx.hit(3);
          }
        }
        if (player.alive && Math.abs(player.x - px) < 20 && player.y > p.y - 6 && player.y < p.y + 26) killPlayer(true);
        for (const e of p.crushed) { e.x = px; e.y = p.y + 16; }
        const target = cy(p.r + 1);
        if (p.y >= target) {
          p.y = target; p.r++;
          if (!(p.r + 1 < ROWS && dug[p.r + 1][p.c])) shatter(p);
        }
      }
    }
    pots = pots.filter(p => p.state !== 'gone');
  }

  function shatter(p) {
    p.state = 'gone'; potsDropped++;
    const n = p.crushed.length;
    for (const e of p.crushed) { e.state = 'dead'; burst(e.x, e.y, '#9bb84a', 8, 140); }
    if (n) { const pts = CRUSH_POINTS[Math.min(n, 8)]; addScore(pts); floatText(cx(p.c), p.y - 10, pts); }
    const shards = ['#c8643a', '#a44a28', '#e08a5a', '#7a2f18'];
    for (let i = 0; i < 20; i++) {
      particles.push({ x: cx(p.c) + rand(-8, 8), y: p.y + rand(-8, 8), vx: rand(-150, 150), vy: rand(-240, -60),
                       life: rand(0.5, 0.9), max: 0.9, color: shards[i % 4], size: rand(2.5, 5), g: 650, spin: rand(-10, 10) });
    }
    shake = Math.max(shake, 7);
    sfx.shatter();
    if (potsDropped === 2 && !dallah) dallah = { x: cx(START.c), y: cy(START.r), t: 10 };
  }

  function updateDallah(dt) {
    if (!dallah) return;
    dallah.t -= dt;
    if (dallah.t <= 0) { dallah = null; return; }
    if (Math.hypot(player.x - dallah.x, player.y - dallah.y) < 18) {
      const pts = 400 + level * 100;
      addScore(pts); floatText(dallah.x, dallah.y - 16, pts);
      burst(dallah.x, dallah.y, '#ffd84a', 18, 180);
      sfx.bonus(); dallah = null;
    }
  }

  // ---------- main update ----------
  function update(dt) {
    time += dt; stateT += dt;
    shake = Math.max(0, shake - dt * 20);
    updateParticles(dt);
    if (state === 'ready') { if (stateT > 1.4) setState('play'); }
    else if (state === 'play') {
      updatePlayer(dt); updatePebble(dt); updateEnemies(dt); updateVenoms(dt); updatePots(dt); updateDallah(dt);
      if (state === 'play' && enemies.every(e => e.state === 'dead')) { setState('clear'); sfx.clear(); saveBest(); }
    }
    else if (state === 'dying') { updatePots(dt); if (stateT > 1.8) afterDeath(); }
    else if (state === 'clear') { if (stateT > 2.4) { level++; buildLevel(); setState('ready'); } }
    else if (state === 'title') { for (const e of enemies) e.anim += dt; }
  }

  // ---------- drawing ----------
  function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }

  function drawKid(x, y, o) {
    ctx.save();
    if (o.shadow) { ctx.fillStyle = 'rgba(20,8,2,.35)'; ellipse(x, y + 13.5, 9 * (o.sx || 1), 2.4); }
    ctx.translate(x, y + (o.bob || 0));
    if (o.rot) ctx.rotate(o.rot);
    ctx.scale((o.sx || 1) * (o.hface || 1), o.sy || 1);
    const step = o.step || 0;
    // sandals and feet
    ctx.fillStyle = '#3b2414';
    ellipse(-4, 12.6 - (step > 0 ? 1.5 : 0), 3.6, 1.6); ellipse(4, 12.6 - (step < 0 ? 1.5 : 0), 3.6, 1.6);
    ctx.fillStyle = '#b07a4c';
    ellipse(-3.5, 11.6 - (step > 0 ? 1.5 : 0), 2.6, 1.3); ellipse(4.5, 11.6 - (step < 0 ? 1.5 : 0), 2.6, 1.3);
    // thobe, lit from the upper right, with a few folds
    const tg = ctx.createLinearGradient(-9, 0, 9, 0);
    tg.addColorStop(0, '#c9c1b2'); tg.addColorStop(0.55, '#f5f2ea'); tg.addColorStop(1, '#ffffff');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(6, -3);
    ctx.quadraticCurveTo(8.5, 4, 9, 11.5); ctx.quadraticCurveTo(0, 13, -9, 11.5); ctx.quadraticCurveTo(-8.5, 4, -6, -3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,100,70,.35)'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-3, 2); ctx.quadraticCurveTo(-4, 7, -5, 11.5);
    ctx.moveTo(2, 3); ctx.quadraticCurveTo(2.5, 8, 3, 12);
    ctx.moveTo(1, -3); ctx.lineTo(1, 3);
    ctx.stroke();
    // head
    const sk = ctx.createRadialGradient(3, -9, 1, 1.5, -7, 7);
    sk.addColorStop(0, '#e2aa78'); sk.addColorStop(1, '#9c6438');
    ctx.fillStyle = sk; ellipse(1.5, -7, 6.3, 6.5);
    // shemagh: white cloth with a fine red pattern, draping down the back
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-9, 5);
    ctx.quadraticCurveTo(-11, -6, -6, -13);
    ctx.quadraticCurveTo(1, -17, 8.5, -11.5);
    ctx.lineTo(8, -9.5);
    ctx.quadraticCurveTo(1.5, -12, -2, -8);
    ctx.quadraticCurveTo(-3.5, -2, -1, 4);
    ctx.closePath();
    const kg = ctx.createLinearGradient(-10, -16, 8, 4);
    kg.addColorStop(0, '#ffffff'); kg.addColorStop(1, '#d8d2c6');
    ctx.fillStyle = kg; ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,40,.4)'; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.clip();
    ctx.fillStyle = 'rgba(190,30,35,.9)';
    for (let i = -12; i < 12; i += 2) for (let j = -18; j < 6; j += 2) if ((((i + j) >> 1) & 1) === 0) ctx.fillRect(i, j, 1, 1);
    ctx.fillStyle = 'rgba(80,50,30,.18)'; ellipse(-6, -2, 4, 8);
    ctx.restore();
    ctx.strokeStyle = '#e9e3d6'; ctx.lineWidth = 0.6;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-8.5 + i * 2, 4.5); ctx.lineTo(-8.8 + i * 2, 6.5); ctx.stroke(); }
    // agal: two black cords with a little sheen
    ctx.strokeStyle = '#141414'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0.5, -12.3, 7.2, 1.9, -0.18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0.5, -11, 7.4, 1.9, -0.18, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.ellipse(0.5, -12.6, 6.8, 1.6, -0.18, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
    // face
    ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(3, -9.4); ctx.lineTo(6, -9.7); ctx.stroke();
    ctx.fillStyle = '#1e120a'; ellipse(4.6, -7.4, 1, 1.25);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ellipse(4.9, -7.8, 0.35, 0.35);
    ctx.fillStyle = 'rgba(120,60,30,.5)'; ellipse(7.2, -5.8, 0.9, 0.7);
    ctx.strokeStyle = 'rgba(90,40,20,.7)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(4.5, -3.6); ctx.quadraticCurveTo(5.7, -3.1, 6.6, -3.7); ctx.stroke();
    // wooden slingshot, aimed along the facing direction
    const aim = o.aim || DIRS.R;
    let ang = 0, hx = 8, hy = 2;
    if (aim.y < 0) { ang = -Math.PI / 2; hx = 6; hy = -14; }
    else if (aim.y > 0) { ang = Math.PI / 2; hx = 6; hy = 10; }
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.lineCap = 'round';
    const fork = () => { ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(3, 0); ctx.moveTo(3, 0); ctx.lineTo(8, -4); ctx.moveTo(3, 0); ctx.lineTo(8, 4); ctx.stroke(); };
    ctx.strokeStyle = '#5e3518'; ctx.lineWidth = 2.2; fork();
    ctx.strokeStyle = '#a06a3a'; ctx.lineWidth = 0.7; fork();
    const pull = o.shoot ? 0 : 3;
    ctx.strokeStyle = '#4a2e20'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(8 - pull, 0); ctx.lineTo(8, 4); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#c48a5a'; ellipse(hx, hy, 2.2, 2.2);
    ctx.restore();
  }

  function drawPlayer() {
    if (!player.alive) {
      if (player.crushed) { drawKid(player.x, player.y + 8, { hface: player.hface, sx: 1.3, sy: 0.3 }); return; }
      const t = Math.min(stateT, 1.2);
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 1.4);
      drawKid(player.x, player.y, { hface: player.hface, rot: t * 12, sx: 1 - t * 0.5, sy: 1 - t * 0.5 });
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const a = time * 6 + i * TAU / 3;
        drawStar(player.x + Math.cos(a) * 12, player.y - 16 + Math.sin(a) * 4, 3, '#ffe066');
      }
      return;
    }
    const moving = player.moving;
    const ph = player.anim * 18;
    const sq = moving ? Math.sin(ph) * 0.06 : Math.sin(time * 3) * 0.02;
    drawKid(player.x, player.y, {
      hface: player.hface, aim: player.face, shoot: player.shootT > 0, shadow: true,
      sx: 1 - sq, sy: 1 + sq, bob: moving ? -Math.abs(Math.sin(ph)) * 2 : 0,
      step: moving ? Math.sign(Math.sin(ph)) : 0
    });
  }

  function drawStar(x, y, r, color) {
    ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }

  function mixColor(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  const LIZ_SPOTS = [[-7, -2, 1.6], [-3, -4, 1.3], [1, -3.5, 1.5], [4, -1, 1.1], [-5, 1.5, 1.2], [0, 0.5, 1.4], [-9, 0, 1], [2.5, 2, 1]];
  function drawLizard(e, o = {}) {
    const white = e.flash > 0, hitT = Math.min(1, e.hits / 3);
    const tint = c => (white ? '#ffffff' : mixColor(c, '#e0482a', hitT * 0.75));
    const moving = e.state === 'walk' || e.state === 'ghost';
    const wag = moving ? Math.sin(e.anim * 10) * 2 : 0;
    ctx.save();
    if (!o.flat && e.state !== 'ghost') { ctx.fillStyle = 'rgba(20,8,2,.3)'; ellipse(e.x, e.y + 8, 14, 2.6); }
    ctx.translate(e.x, e.y);
    const s = 1 + 0.14 * e.hits + e.squash * 0.15;
    let sx = s * (1 + e.squash * 0.15), sy = s * (1 - e.squash * 0.12);
    if (o.flat) { sx = 1.4; sy = 0.35; }
    ctx.scale(sx * e.face, sy);
    // tail: thick at the base, tapering, ringed with spikes
    const tgr = ctx.createLinearGradient(0, -4, 0, 5);
    tgr.addColorStop(0, tint('#b49a4a')); tgr.addColorStop(1, tint('#5e5228'));
    ctx.fillStyle = tgr;
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.quadraticCurveTo(-15, -3 + wag, -22, 1.5 + wag); ctx.quadraticCurveTo(-15, 5 + wag * 0.5, -6, 4.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = tint('#4e4420');
    for (let i = 0; i < 5; i++) {
      const tx = -8 - i * 2.8, tw = wag * (i / 5), hh = 3.6 - i * 0.55;
      ctx.beginPath(); ctx.moveTo(tx + 1.2, -hh * 0.6 + tw); ctx.lineTo(tx - 0.4, -hh - 1 + tw); ctx.lineTo(tx - 1.2, -hh * 0.4 + tw); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx + 1.2, hh * 0.6 + tw); ctx.lineTo(tx - 0.4, hh + 1 + tw); ctx.lineTo(tx - 1.2, hh * 0.4 + tw); ctx.fill();
    }
    // legs with claws
    const lp = moving ? Math.sin(e.anim * 14) * 2 : 0;
    const leg = (hx, f, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      const fx = hx + f, fy = 7.5;
      ctx.beginPath(); ctx.moveTo(hx, 2.5); ctx.quadraticCurveTo(hx + f * 0.3 + 2, 5, fx, fy); ctx.stroke();
      ctx.lineWidth = 0.6;
      for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + 2, fy + 0.8 + k * 0.9); ctx.stroke(); }
    };
    leg(-4, -lp, tint('#4a4020')); leg(7, lp, tint('#4a4020'));
    leg(-6, lp, tint('#6a5c2c')); leg(5, -lp, tint('#6a5c2c'));
    // body: olive-yellow back fading to a grey-brown belly, mottled
    const bg = ctx.createRadialGradient(0, -3, 1, 0, 0, 11);
    bg.addColorStop(0, tint('#e3c45a')); bg.addColorStop(0.6, tint('#b49a40')); bg.addColorStop(1, tint('#6c5e2c'));
    ctx.fillStyle = bg; ellipse(0, 0, 11, 7.2);
    if (!white) {
      ctx.fillStyle = 'rgba(70,55,20,.35)';
      for (const [px, py, pr] of LIZ_SPOTS) ellipse(px, py, pr, pr * 0.75);
      ctx.fillStyle = 'rgba(255,240,190,.2)';
      for (let i = -9; i <= 8; i += 2.2) for (let j = -5; j <= 3; j += 2.2) if ((Math.round(i * 7 + j * 13) % 3) === 0) ctx.fillRect(i, j, 0.7, 0.7);
      ctx.fillStyle = 'rgba(255,250,220,.25)'; ellipse(1, -4.2, 6, 1.6);
    }
    // head: grey-olive with a blunt snout
    const hg = ctx.createRadialGradient(10, -3.5, 0.5, 10, -1, 7);
    hg.addColorStop(0, tint('#b8b08a')); hg.addColorStop(1, tint('#6a6448'));
    ctx.fillStyle = hg; ctx.beginPath(); ctx.ellipse(10, -1.2, 6.8, 5.4, -0.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(50,40,20,.6)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(10.5, 1.8); ctx.quadraticCurveTo(14, 2.6, 16.3, 0.3); ctx.stroke();
    ctx.fillStyle = 'rgba(40,30,15,.8)'; ellipse(15.6, -2, 0.5, 0.4);
    // eye: golden iris, pupil tracking the player, heavy brow ridge
    const ex = 12, ey = -3.4;
    ctx.fillStyle = tint('#5a5238'); ellipse(ex, ey - 1.3, 2.9, 1.4);
    ctx.fillStyle = white ? '#ffffff' : '#d8b040'; ellipse(ex, ey, 2, 2);
    if (e.state === 'stunned') {
      ctx.strokeStyle = '#1d1208'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(ex - 1.6, ey - 1.6); ctx.lineTo(ex + 1.6, ey + 1.6); ctx.moveTo(ex + 1.6, ey - 1.6); ctx.lineTo(ex - 1.6, ey + 1.6); ctx.stroke();
    } else {
      const lx = (player.x - e.x) * e.face, ly = player.y - e.y, ll = Math.hypot(lx, ly) || 1;
      ctx.fillStyle = '#120c06'; ellipse(ex + lx / ll * 0.6, ey + ly / ll * 0.6, 0.9, 1.4);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ellipse(ex + 0.6, ey - 0.7, 0.4, 0.4);
    }
    ctx.restore();
  }

  function drawCobra(e, o = {}) {
    const white = e.flash > 0, hitT = Math.min(1, e.hits / 3);
    const tint = c => (white ? '#ffffff' : mixColor(c, '#d0442a', hitT * 0.75));
    const moving = e.state === 'walk' || e.state === 'ghost';
    const sway = moving ? Math.sin(e.anim * 8) * 1.5 : 0;
    const wind = e.state === 'windup' ? Math.min(1, e.windT / 0.25) : 0;
    ctx.save();
    if (!o.flat && e.state !== 'ghost') { ctx.fillStyle = 'rgba(20,8,2,.3)'; ellipse(e.x - 2, e.y + 12, 15, 2.6); }
    ctx.translate(e.x, e.y);
    const s = 1 + 0.14 * e.hits + e.squash * 0.15;
    let sx = s * (1 + e.squash * 0.15), sy = s * (1 - e.squash * 0.12);
    if (o.flat) { sx = 1.4; sy = 0.35; }
    ctx.scale(sx * e.face, sy);
    if (wind) ctx.translate(-wind * 2 + Math.sin(e.windT * 60) * 0.6, 0);
    // coils: dark, glossy, lit from above
    const cg = ctx.createLinearGradient(0, 2, 0, 13);
    cg.addColorStop(0, tint('#6b543a')); cg.addColorStop(0.5, tint('#3a2c1e')); cg.addColorStop(1, tint('#1c140c'));
    ctx.fillStyle = cg;
    ellipse(-6, 7, 10.5, 5.2); ellipse(4, 8, 9, 4.6);
    ctx.beginPath(); ctx.moveTo(-14, 7); ctx.quadraticCurveTo(-19, 4 + sway, -20, 1 + sway); ctx.quadraticCurveTo(-17, 7, -13, 10); ctx.fill();
    if (!white) {
      ctx.strokeStyle = 'rgba(200,170,120,.3)'; ctx.lineWidth = 0.9;
      for (let i = -12; i <= 10; i += 3.2) { ctx.beginPath(); ctx.arc(i + sway * 0.5, 7.5, 4.2, -2.4, -0.7); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,240,210,.22)'; ellipse(-6, 4, 7, 1.3); ellipse(4, 5.3, 6, 1.1);
    }
    // raised neck
    const ng = ctx.createLinearGradient(4, 0, 12, 0);
    ng.addColorStop(0, tint('#2a1f15')); ng.addColorStop(1, tint('#5a4632'));
    ctx.strokeStyle = ng; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, 6); ctx.quadraticCurveTo(10 + sway, 0, 7 + sway * 0.5, -7); ctx.stroke();
    // hood, wider while winding up; pale throat with dark bands
    const hw = 6 + wind * 4, hx = 7 + sway * 0.5, hy = -8;
    const hg = ctx.createRadialGradient(hx + 2, hy - 2, 1, hx, hy, hw + 2);
    hg.addColorStop(0, tint('#6e5840')); hg.addColorStop(1, tint('#21180f'));
    ctx.fillStyle = hg; ellipse(hx, hy, hw, 7.5);
    ctx.fillStyle = tint('#d9c191'); ellipse(hx + 1.2, hy + 1, hw * 0.45, 5.2);
    if (!white) { ctx.fillStyle = 'rgba(40,25,12,.75)'; ellipse(hx + 1.2, hy + 0.5, hw * 0.42, 0.9); ellipse(hx + 1.2, hy + 3, hw * 0.38, 0.8); }
    // head
    const hd = ctx.createRadialGradient(hx + 4, hy - 8, 0.5, hx + 4, hy - 6, 6);
    hd.addColorStop(0, tint('#7a6248')); hd.addColorStop(1, tint('#2a1f15'));
    ctx.fillStyle = hd; ctx.beginPath(); ctx.ellipse(hx + 4.5, hy - 6, 5.6, 3.9, 0.1, 0, TAU); ctx.fill();
    const ex = hx + 5.5, ey = hy - 7;
    if (e.state === 'stunned') {
      ctx.strokeStyle = '#f2e6c8'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(ex - 1.4, ey - 1.4); ctx.lineTo(ex + 1.4, ey + 1.4); ctx.moveTo(ex + 1.4, ey - 1.4); ctx.lineTo(ex - 1.4, ey + 1.4); ctx.stroke();
    } else {
      ctx.fillStyle = '#0d0905'; ellipse(ex, ey, 1.5, 1.5);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ellipse(ex + 0.5, ey - 0.5, 0.45, 0.45);
    }
    // open mouth while winding up, otherwise a flicking tongue
    if (wind) {
      ctx.fillStyle = '#5a1414'; ellipse(hx + 9, hy - 5, 2 * wind, 1.6 * wind);
      ctx.fillStyle = '#9be04a'; ellipse(hx + 10, hy - 5, 1.2 * wind, 1.2 * wind);
    } else if (moving && Math.sin(e.anim * 5) > 0.6) {
      ctx.strokeStyle = '#b8282a'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(hx + 9.5, hy - 5); ctx.lineTo(hx + 13, hy - 5); ctx.lineTo(hx + 14.5, hy - 6.5);
      ctx.moveTo(hx + 13, hy - 5); ctx.lineTo(hx + 14.5, hy - 3.5); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCreature(e, o) { if (e.kind === 'cobra') drawCobra(e, o); else drawLizard(e, o); }

  function drawEnemy(e) {
    if (e.state === 'dead') return;
    if (e.state === 'ghost') {
      ctx.save();
      ctx.globalAlpha = 0.28 + 0.1 * Math.sin(time * 8);
      drawCreature(e, {});
      ctx.restore();
      const f = e.face, ey = e.kind === 'cobra' ? e.y - 14 : e.y - 3;
      ctx.fillStyle = '#fff'; ellipse(e.x + f * 4, ey, 3.2, 3.6); ellipse(e.x + f * 11, ey, 3.2, 3.6);
      ctx.fillStyle = '#1d1208'; ellipse(e.x + f * 5, ey, 1.5, 1.9); ellipse(e.x + f * 12, ey, 1.5, 1.9);
      return;
    }
    if (e.state === 'pop') {
      const t = e.popT / 0.45;
      ctx.save(); ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 3 * (1 - t);
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 + t * 30, 0, TAU); ctx.stroke();
      ctx.translate(e.x, e.y); ctx.scale(1 + t, 1 + t); ctx.translate(-e.x, -e.y);
      drawCreature(e, {});
      ctx.restore();
      return;
    }
    drawCreature(e, { flat: e.state === 'crushed' });
    if (e.flee && e.state === 'walk') {
      const bob = Math.sin(time * 14) * 1.5;
      ctx.fillStyle = '#9fd8ff';
      ctx.beginPath(); ctx.moveTo(e.x - e.face * 6, e.y - 20 + bob);
      ctx.quadraticCurveTo(e.x - e.face * 9, e.y - 14 + bob, e.x - e.face * 6, e.y - 13 + bob);
      ctx.quadraticCurveTo(e.x - e.face * 3, e.y - 14 + bob, e.x - e.face * 6, e.y - 20 + bob); ctx.fill();
    }
    if (e.state === 'stunned') {
      for (let i = 0; i < 3; i++) {
        const a = time * 7 + i * TAU / 3;
        drawStar(e.x + Math.cos(a) * 11, e.y - 14 - e.hits * 2 + Math.sin(a) * 3, 3, '#ffe066');
      }
    }
  }

  function drawPot(p) {
    ctx.save();
    ctx.translate(cx(p.c), p.y);
    if (p.state === 'wobble') ctx.rotate(Math.sin(p.t * 40) * 0.14);
    ctx.fillStyle = 'rgba(30,12,4,.35)'; ellipse(0, 12.5, 11, 2.6);
    const body = new Path2D();
    body.moveTo(-5, -11); body.lineTo(5, -11);
    body.quadraticCurveTo(5, -7, 10, -3);
    body.quadraticCurveTo(14, 6, 6, 12);
    body.lineTo(-6, 12);
    body.quadraticCurveTo(-14, 6, -10, -3);
    body.quadraticCurveTo(-5, -7, -5, -11);
    const g = ctx.createRadialGradient(-4, -3, 1, 0, 2, 16);
    g.addColorStop(0, '#e8956a'); g.addColorStop(0.45, '#bf5e34'); g.addColorStop(1, '#6e2c14');
    ctx.fillStyle = g; ctx.fill(body);
    ctx.save();
    ctx.clip(body);
    ctx.fillStyle = 'rgba(60,20,8,.55)'; ctx.fillRect(-14, -1.5, 28, 1.4); ctx.fillRect(-14, 6.5, 28, 1.1);
    ctx.strokeStyle = 'rgba(60,20,8,.6)'; ctx.lineWidth = 0.9;
    ctx.beginPath(); for (let i = 0; i <= 12; i++) ctx.lineTo(-12 + i * 2, 2.6 + (i % 2 ? 1.4 : -1.2)); ctx.stroke();
    ctx.fillStyle = 'rgba(230,200,150,.4)'; ellipse(-3, -6, 8, 2.2);
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(255,220,190,.25)' : 'rgba(60,20,8,.3)';
      ctx.fillRect(-11 + hash2(i, p.c, 3) * 22, -8 + hash2(i, p.c, 4) * 19, 0.8, 0.8);
    }
    ctx.restore();
    const rg = ctx.createLinearGradient(-7, -14, 7, -10);
    rg.addColorStop(0, '#d0744a'); rg.addColorStop(1, '#7a3418');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.roundRect(-7, -14, 14, 3.5, 1.5); ctx.fill();
    ctx.fillStyle = '#2a0f06'; ellipse(0, -13.4, 4.6, 0.9);
    ctx.fillStyle = 'rgba(255,230,200,.35)'; ellipse(-5.5, -1, 1.5, 5, -0.3);
    ctx.restore();
  }

  function drawDallah(x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(30,12,4,.3)'; ellipse(0, 12.5, 9, 2);
    const brass = ctx.createLinearGradient(-9, 0, 9, 0);
    brass.addColorStop(0, '#6a4404'); brass.addColorStop(0.3, '#e9c25a'); brass.addColorStop(0.45, '#fff4c4');
    brass.addColorStop(0.6, '#d9a62a'); brass.addColorStop(1, '#5e3c04');
    ctx.strokeStyle = '#8a5e0c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-8, 0, 5, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.fillStyle = brass;
    ctx.beginPath(); ctx.moveTo(6, 2); ctx.quadraticCurveTo(12, 0, 13, -10); ctx.lineTo(15, -11); ctx.quadraticCurveTo(13, 2, 6, 6); ctx.fill();
    ellipse(0, 6, 8.5, 6);
    ctx.beginPath(); ctx.moveTo(-4.5, 2); ctx.lineTo(-3, -6); ctx.lineTo(3, -6); ctx.lineTo(4.5, 2); ctx.fill();
    ctx.fillStyle = '#9a6a10'; ellipse(0, -7, 4.5, 1.6);
    ctx.fillStyle = brass;
    ctx.beginPath(); ctx.moveTo(-3.5, -7); ctx.quadraticCurveTo(0, -14, 3.5, -7); ctx.fill();
    ellipse(0, -14, 1.5, 1.5);
    ctx.strokeStyle = 'rgba(90,60,10,.6)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.ellipse(0, 6, 6.5, 3.5, 0, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 3); ctx.lineTo(6, 3); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,235,.7)'; ellipse(-2.5, 4.5, 1.2, 3, -0.2);
    ctx.restore();
    drawStar(x + 8 * scale, y - 6 * scale + Math.sin(time * 5) * 2, 2.5 + Math.sin(time * 9), '#fffbe0');
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = p.puff ? a * 0.45 : a;
      ctx.fillStyle = p.color;
      if (p.puff) { ellipse(p.x, p.y, p.size, p.size); }
      else if (p.spin) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin * (p.max - p.life));
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7); ctx.restore();
      } else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function outlinedText(txt, x, y, size, fill = '#ffd36b', align = 'center') {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size * 0.2); ctx.strokeStyle = '#3a1d0c';
    ctx.strokeText(txt, x, y);
    const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    g.addColorStop(0, '#fff6d0'); g.addColorStop(1, fill);
    ctx.fillStyle = g; ctx.fillText(txt, x, y);
  }
  function plainText(txt, x, y, size, color = '#fbe7c6', align = 'center') {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(txt, x, y);
  }

  function drawHUD() {
    const label = (t, x, align) => { ctx.font = `11px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(40,40,70,.75)'; ctx.fillText(t, x, 13); };
    label('SCORE', 12, 'left'); label('BEST', W / 2, 'center'); label('LEVEL ' + level, W - 12, 'right');
    outlinedText(String(score).padStart(6, '0'), 12, 31, 20, '#ffd36b', 'left');
    outlinedText(String(best).padStart(6, '0'), W / 2, 31, 20, '#ffb46b', 'center');
    for (let i = 0; i < lives - 1; i++) {
      drawKid(W - 20 - i * 20, 33, { sx: 0.6, sy: 0.6, hface: -1 });
    }
  }

  function dim(a = 0.55) { ctx.fillStyle = `rgba(29,15,8,${a})`; ctx.fillRect(0, HUD, W, H - HUD); }

  function drawOverlay() {
    const mid = HUD + (H - HUD) / 2;
    if (state === 'title') {
      dim(0.6);
      const b = Math.sin(time * 3) * 4;
      outlinedText('SAND', W / 2, mid - 120 + b, 58, '#ffb46b');
      outlinedText('DIGGER', W / 2, mid - 70 + b, 58, '#e98a3c');
      drawKid(W / 2 - 60, mid + 6, { sx: 1.8, sy: 1.8 + Math.sin(time * 6) * 0.06, hface: 1, aim: DIRS.R });
      drawLizard({ x: W / 2 + 20, y: mid + 8, face: -1, hits: 0, flash: 0, squash: 0, state: 'walk', anim: time }, {});
      drawCobra({ x: W / 2 + 70, y: mid + 4, face: -1, hits: 0, flash: 0, squash: 0, state: 'walk', anim: time }, {});
      const lines = ['Dig through the dunes.', 'Sling a lizard or cobra 3 times to knock it out.', 'Cobras spit venom sideways, even through sand.',
                     'Dig under pots to drop them on enemies.', 'Drop 2 pots and a golden dallah appears.'];
      lines.forEach((l, i) => plainText(l, W / 2, mid + 50 + i * 19, 14, '#fbe7c6'));
      if (Math.floor(time * 2) % 2 === 0) outlinedText(document.body.classList.contains('touch') ? 'TAP TO START' : 'PRESS ENTER', W / 2, mid + 165, 24, '#ffd36b');
    } else if (state === 'ready') {
      const k = Math.min(1, stateT * 4);
      ctx.save(); ctx.translate(W / 2, mid - 40); ctx.scale(k, k);
      outlinedText(level > 1 ? 'LEVEL ' + level : 'READY!', 0, 0, 40, '#ffd36b');
      ctx.restore();
    } else if (state === 'clear') {
      const k = Math.min(1, stateT * 3);
      ctx.save(); ctx.translate(W / 2, mid - 40); ctx.scale(k, k); ctx.rotate((1 - k) * 0.4);
      outlinedText('LEVEL CLEAR!', 0, 0, 40, '#ffd36b');
      ctx.restore();
      if (escaped && stateT > 0.4) plainText('One got away!', W / 2, mid, 16);
    } else if (state === 'over') {
      dim(Math.min(0.65, stateT));
      outlinedText('GAME OVER', W / 2, mid - 50, 46, '#e98a3c');
      plainText('Score ' + score + (score >= best && score > 0 ? '  ·  new best!' : ''), W / 2, mid, 18);
      if (stateT > 0.8 && Math.floor(time * 2) % 2 === 0) outlinedText(document.body.classList.contains('touch') ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER', W / 2, mid + 50, 22, '#ffd36b');
    }
    if (paused) {
      dim(0.6);
      outlinedText('PAUSED', W / 2, mid, 44, '#ffd36b');
      plainText('Press P or tap to resume', W / 2, mid + 40, 14);
    }
  }

  const vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = H - HUD;
  (function () {
    const g = vignette.getContext('2d'), vh = H - HUD;
    const vg = g.createRadialGradient(W / 2, vh * 0.45, Math.min(W, vh) * 0.35, W / 2, vh * 0.5, Math.max(W, vh) * 0.75);
    vg.addColorStop(0, 'rgba(20,8,2,0)'); vg.addColorStop(1, 'rgba(20,8,2,.45)');
    g.fillStyle = vg; g.fillRect(0, 0, W, vh);
  })();

  function draw() {
    const k = view.scale * view.dpr;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.fillStyle = '#25120a'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * 0.6, rand(-1, 1) * shake * 0.6);
    ctx.drawImage(sky, 0, 0, W, HUD + T);
    composeGround();
    ctx.drawImage(ground, 0, HUD, W, ROWS * T);

    if (enemies.some(e => e.flee && e.state !== 'dead' && e.state !== 'crushed') && Math.floor(time * 4) % 2 === 0) {
      ctx.fillStyle = '#7a4a24'; ctx.fillRect(18, HUD + 6, 3, 22);
      ctx.fillStyle = '#e98a3c'; ctx.beginPath();
      ctx.moveTo(6, HUD + 10); ctx.lineTo(14, HUD + 4); ctx.lineTo(40, HUD + 4); ctx.lineTo(40, HUD + 16); ctx.lineTo(14, HUD + 16); ctx.closePath(); ctx.fill();
      ctx.font = `9px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3a1d0c'; ctx.fillText('EXIT', 27, HUD + 10.5);
    }
    for (const p of pots) drawPot(p);
    if (dallah && (dallah.t > 2.5 || Math.floor(time * 8) % 2 === 0)) drawDallah(dallah.x, dallah.y + Math.sin(time * 4) * 2);
    for (const e of enemies) drawEnemy(e);
    for (const v of venoms) {
      ctx.fillStyle = 'rgba(155,224,74,.3)'; ellipse(v.x - v.dir * 5, v.y, 6, 3.2);
      const vg = ctx.createRadialGradient(v.x + v.dir, v.y - 1, 0.3, v.x, v.y, 4);
      vg.addColorStop(0, '#eaffc8'); vg.addColorStop(0.4, '#8edc3a'); vg.addColorStop(1, '#3f7a14');
      ctx.fillStyle = vg; ellipse(v.x, v.y, 4, 3);
    }
    if (pebble) {
      ctx.fillStyle = 'rgba(255,240,200,.3)'; ellipse(pebble.x - pebble.dir.x * 6, pebble.y - pebble.dir.y * 6, 3, 2.4);
      const pg = ctx.createRadialGradient(pebble.x - 1, pebble.y - 1, 0.3, pebble.x, pebble.y, 3);
      pg.addColorStop(0, '#c8bcae'); pg.addColorStop(1, '#4a4038');
      ctx.fillStyle = pg; ellipse(pebble.x, pebble.y, 3, 2.6);
    }
    if (state !== 'title') drawPlayer();
    drawParticles();
    for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); outlinedText(f.text, f.x, f.y, 16, '#ffe066'); }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.drawImage(vignette, 0, HUD, W, H - HUD);
    drawHUD();
    drawOverlay();
  }

  // ---------- loop ----------
  buildLevel();
  if (location.hash === '#debug') {
    window.__sd = { player, get enemies() { return enemies; }, get pots() { return pots; }, get state() { return state; },
                    get score() { return score; }, get escaped() { return escaped; }, exitStep, get venoms() { return venoms; }, get dug() { return dug; }, hitEnemy, cx, cy };
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) { update(dt); updateMusic(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

    var s = document.createElement('script');

    s.src = 'https://gc.zgo.at/count.js';

  })();
